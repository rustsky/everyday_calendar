name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  native:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  wasm:
    name: Build the client for wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Clippy
        run: cargo clippy -p everydaycalendar --target wasm32-unknown-unknown

      - name: Build
        run: cargo build -p everydaycalendar --target wasm32-unknown-unknown --release

  # The one check branch protection requires. It always runs, so a failed or
  # cancelled job above turns it red instead of leaving it pending.
  ci-result:
    name: CI result
    needs: [native, wasm]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        env:
          NATIVE: ${{ needs.native.result }}
          WASM: ${{ needs.wasm.result }}
        run: |
          icon() { [ "$1" = success ] && echo "✅" || echo "❌"; }
          {
            echo "## CI result"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Format, lint, test | $(icon "$NATIVE") $NATIVE |"
            echo "| Build the client for wasm | $(icon "$WASM") $WASM |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$NATIVE" = success ] && [ "$WASM" = success ]; then
            echo "::notice title=CI passed::All checks passed. Safe to merge."
          else
            echo "::error title=CI failed::native=$NATIVE wasm=$WASM. Merge blocked."
            exit 1
          fi
